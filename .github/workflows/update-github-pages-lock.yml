name: Update github-pages lockfile

on:
  push:
    branches:
      - upgrade/github-pages-232

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler: latest

      - name: Update github-pages and dependencies
        run: bundle update github-pages

      - name: Verify the site builds
        run: bundle exec jekyll build

      - name: Commit updated lockfile
        run: |
          if git diff --quiet -- Gemfile.lock; then
            echo "Gemfile.lock is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Gemfile.lock
          git commit -m "Update Gemfile.lock for github-pages 232 [skip ci]"
          git push

name: Slideshow validation

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    name: Build and validate slideshow
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:assets
      - run: npm audit --omit=dev
      - uses: ruby/setup-ruby@b1da4809b005e0178fe08a1d57317bffc00b7b4c # v1.332.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: sh script/cibuild
      - name: Save built site for review
        uses: actions/upload-artifact@v7
        with:
          name: slideshow-preview
          path: _site
          retention-days: 7

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

{% assign social_title = page.title | default: site.title %}
{% assign social_description = page.description | default: site.description %}
<title>{{ social_title | escape }}</title>
<meta name="description" content="{{ social_description | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.title | escape }}">
<meta property="og:title" content="{{ social_title | escape }}">
<meta property="og:description" content="{{ social_description | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ '/assets/images/og-preview.jpg' | absolute_url }}?v=3">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="627">
<meta property="og:image:alt" content="My First Slideshow opening slide preview">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">

<link rel="stylesheet" href="{{ '/assets/reveal/dist/reset.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/reveal/dist/reveal.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/reveal/dist/theme/moon.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/reveal/dist/plugin/highlight/monokai.css' | relative_url }}">
<!-- reveal.css includes the print and PDF styles. -->
